[package]
name = "lectrice-ffi"
description = "The Kotlin API of the Lectrice core (uniffi) and its Android composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lectrice_ffi"
crate-type = ["cdylib", "lib"]

[features]
# Spike only: synthesis timings straight from the engine.
bench = []

[dependencies]
# Local builds use the .cargo/config.toml path override instead.
lectrice-domain = { git = "https://github.com/kia-salvati/lectrice", tag = "v1.1.0" }
lectrice-app = { git = "https://github.com/kia-salvati/lectrice", tag = "v1.1.0" }
lectrice-infra = { git = "https://github.com/kia-salvati/lectrice", tag = "v1.1.0", default-features = false, features = ["pdfium", "kokoro"] }
uniffi.workspace = true
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"
